[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braintumor"
version = "0.1.0"
description = "Brain Tumor MRI Analysis — ML layer (research prototype)"
requires-python = ">=3.10"
license = { text = "MIT (research/educational prototype)" }

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "nibabel>=5.2",
    "scikit-image>=0.21",
    "monai>=1.3.0",
    "pydantic>=2.5",
    "pyvista>=0.43",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.7",
    "black>=23.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"braintumor" = ["py.typed"]
